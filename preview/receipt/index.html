 pay:{kind:'代付请求',merchant:'品牌极速达',heading:'待对方代付',title:'「静谧森林」复方疗愈精油 10ml',sub:'官方标配 / 默认款',qty:'×1',total:'¥189.00',moneyName:'待付金额',state:'等待对方代付',cta:'查看代付详情',date:'2026/10/25 14:51',serial:'PAY·20261025',cover:'FOREST',coverNum:'10',coverUnit:'ML'},
 food:{kind:'外卖代付',merchant:'一碗好饭 · 能量便当',heading:'外卖代付',title:'香煎鸡胸藜麦能量碗',sub:'餐盒打包费 ¥2.00 / 配送费 ¥0.00',qty:'×1',total:'¥37.00',moneyName:'待付餐费',state:'等待对方代付',cta:'查看外卖订单',date:'2026/10/25 14:51',serial:'FOOD·20261025',cover:'ENERGY',coverNum:'01',coverUnit:'BOWL'},
 shop:{kind:'店铺分享',merchant:'Atelier of Self',heading:'店铺分享',title:'Atelier of Self',sub:'主理人品牌 / 独立设计',qty:'',total:'31.2万',moneyName:'店铺粉丝',state:'已分享',cta:'进入店铺',date:'2026/10/25 14:51',serial:'SHOP·20261025',cover:'A',coverNum:'',coverUnit:''}
 };
 let scheme='a',kind='goods';
 const mount=document.getElementById('mount'),closed=document.getElementById('closed'),shopPreview=document.getElementById('shopPreview'),shopContent=document.getElementById('shopContent');
 const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const thumb=(d,mini='')=>`<div class="thumb ${kind==='food'?'food':kind==='shop'?'shop':''}" aria-label="示意商品封面">${kind==='shop'?'<b>A</b>':`<span>${esc(d.cover)}</span><b>${esc(d.coverNum)}</b><small>${esc(d.coverUnit)}</small>`}</div>`;
 const detailRows=d=>`<div class="detail-row"><span>商家</span><span>${esc(d.merchant)}</span></div><div class="detail-row"><span>发送时间</span><span class="number">${esc(d.date)}</span></div><div class="detail-row"><span>发送方</span><span>用户</span></div>`;
 const product=d=>`${thumb(d)}<div style="min-width:0;flex:1"><div class="good-main">${esc(d.title)}</div><div class="good-sub">${esc(d.sub)}</div><div class="good-qty">${esc(d.qty)}</div></div><span class="product-arrow" aria-hidden="true">›</span>`;
 const close=()=>`<div class="ticket-footer"><button type="button" class="ticket-close" data-close="1">关闭</button></div>`;
 function templateA(d){return `<article class="ticket a" role="dialog" aria-modal="true" aria-label="${esc(d.kind)}购物小票"><div class="ticket-body"><div class="a-top"><div class="logo-chip">▤　童话集 · 购物凭单</div></div><div class="a-heading"><div class="cap">OFFICIAL RECEIPT / 2026</div><h2>${esc(d.merchant)}</h2><p>${esc(d.kind)} · 你发送的卡片</p></div><div class="a-status">●　${esc(d.state)}</div><hr class="line"><button type="button" class="a-product product-open" data-product="1" aria-label="在商城查看 ${esc(d.title)}">${product(d)}</button><hr class="line"><div class="a-price"><span>${esc(d.moneyName)}</span><strong class="number">${esc(d.total)}</strong></div><div class="a-details">${detailRows(d)}</div><div class="a-end"><span>THANK YOU · 童话集</span><span>NO. 001</span></div></div>${close()}</article>`}
 function templateB(d){return `<article class="ticket b" role="dialog" aria-modal="true" aria-label="${esc(d.kind)}购物小票"><div class="ticket-body b-inner"><div class="b-top"><span class="cap">PRINTED RECEIPT</span></div><div class="b-heading"><div class="brandname">童话集</div><div class="serial">SHOPPING / ORIGINAL TICKET</div></div><div class="b-mid">${esc(d.heading)}</div><div class="detail-row" style="padding-top:14px"><span>商户</span><span>${esc(d.merchant)}</span></div><div class="detail-row"><span>日期</span><span class="number">${esc(d.date)}</span></div><div class="detail-row"><span>状态</span><span>${esc(d.state)}</span></div><button type="button" class="b-product product-open" data-product="1" aria-label="在商城查看 ${esc(d.title)}">${product(d)}</button><div class="b-item-lines"><div class="detail-row"><span>规格 / 备注</span><span>${esc(d.sub)}</span></div><div class="detail-row"><span>数量</span><span>${esc(d.qty||'—')}</span></div></div><div class="b-final"><span class="cap">${esc(d.moneyName)}</span><strong class="number">${esc(d.total)}</strong></div><div class="b-code"><div class="barcode" aria-hidden="true"></div><small>${esc(d.serial)}</small></div></div>${close()}</article>`}
 function templateC(d){return `<article class="ticket c" role="dialog" aria-modal="true" aria-label="${esc(d.kind)}购物小票"><div class="ticket-body"><div class="c-black"><div class="c-head"><span>FAIRYTALE / RECEIPT</span></div><div class="c-kicker">▤ &nbsp; NO. ${esc(d.serial)}</div><h2>${esc(d.heading)}</h2><p>${esc(d.state)}　/　${esc(d.merchant)}</p><div class="c-total"><strong class="number">${esc(d.total)}</strong><small>${esc(d.moneyName)} / CNY</small></div></div><div class="c-divider"></div><div class="c-white"><div class="c-title">ITEM DETAILS / 商品明细</div><button type="button" class="c-product product-open" data-product="1" aria-label="在商城查看 ${esc(d.title)}">${product(d)}</button><div class="c-detail">${detailRows(d)}</div><div class="c-end"><span>童话集 · OFFICIAL RECEIPT</span><span>01 / 01</span></div></div></div>${close()}</article>`}
 function templateD(d){return `<article class="ticket d" role="dialog" aria-modal="true" aria-label="${esc(d.kind)}购物小票"><div class="ticket-body"><div class="d-upper"><div class="d-header"><div><strong>童话集 / RECEIPT</strong><small>DOUBLE COPY · 2026</small></div><div class="d-top-number">${esc(d.serial)}</div></div><div class="d-display"><div class="cap">PURCHASE RECORD / 购物凭单</div><h2>${esc(d.heading)}</h2><div class="state">${esc(d.state)}</div></div></div><div class="d-cut"></div><button type="button" class="d-item product-open" data-product="1" aria-label="在商城查看 ${esc(d.title)}">${product(d)}</button><div class="d-total-box"><div class="cap">${esc(d.moneyName)}</div><div class="money number">${esc(d.total)}</div></div><div class="d-two"><div><div class="cell-label">发送时间</div><div class="cell-value">${esc(d.date)}</div></div><div><div class="cell-label">发送方</div><div class="cell-value">用户</div></div><div><div class="cell-label">商家信息</div><div class="cell-value">${esc(d.merchant)}</div></div><div><div class="cell-label">订单状态</div><div class="cell-value">${esc(d.state)}</div></div></div><div class="d-cut"></div><div class="d-stub"><div class="d-stub-top"><span>DETACHABLE STUB</span><small>童话集 · 001</small></div></div></div>${close()}</article>`}
 function render(){const d=variants[kind],html={a:templateA,b:templateB,c:templateC,d:templateD}[scheme](d);mount.innerHTML=html;document.querySelectorAll('[data-scheme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scheme===scheme)));document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));closed.classList.remove('show');shopPreview.classList.remove('show');}
 function openShopPreview(){const d=variants[kind];shopContent.innerHTML=`<div class="shop-big">商城商品 / 店铺封面预览</div><h3>${esc(d.title)}</h3><p>${esc(d.merchant)} · ${esc(d.sub)}</p><div class="shop-price">${esc(d.total)}</div><p>交互预览：正式接入童话集后，点击小票商品将直接打开商城内对应的${kind==='shop'?'店铺':'商品或餐品'}详情。</p>`;shopPreview.classList.add('show');closed.classList.remove('show');}
 document.querySelectorAll('[data-scheme]').forEach(b=>b.addEventListener('click',()=>{scheme=b.dataset.scheme;render()}));
 document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;render()}));
 mount.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closed.classList.add('show');if(e.target.closest('[data-product]'))openShopPreview();});
 document.getElementById('shopBack').addEventListener('click',()=>shopPreview.classList.remove('show'));
 document.getElementById('reopen').addEventListener('click',render);
 render();
})();
</script>
</body>
</html>
